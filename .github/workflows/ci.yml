name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check src tests benchmark
      - run: uv run ruff format --check src tests benchmark
      - run: uv run pytest -q -m "not docker" --cov=holdout_vault --cov-fail-under=85
      - run: uvx pip-audit
      - run: uv build
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks action scans the push range, which breaks on a new repo's first push
      # (its base commit is not in the clone); the CLI scans the full history instead.
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /tmp gitleaks
          /tmp/gitleaks git --redact -v .
