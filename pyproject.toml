[project]
name = "holdout-vault"
version = "0.1.0"
description = "MCP server that seals ML test labels and the scorer away from coding agents, and proves every reported metric."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Janish Kumar" }]
dependencies = [
    "mcp>=2.3,<3",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[project.scripts]
holdout-vault = "holdout_vault.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holdout_vault"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
# labelled corpora are fixture code, kept exactly as written
extend-exclude = ["benchmark/corpus"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["docker: needs a running Docker daemon"]

[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.local.md", "*.local.md", "benchmark/results/*_logs", "dist"]
